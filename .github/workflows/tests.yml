name: Tests

# Runs on every push and PR. The live bot runs on the VM, not here — this
# workflow only proves the playbook guards still hold before you pull to the VM.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playbook-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q btst_engine.py providers.py watcher.py

      - name: Playbook guard tests
        # No secrets: the suite is offline by construction (no Telegram creds,
        # every provider call mocked). If a test ever needs the network, it is
        # the wrong test.
        run: python test_playbook_guards.py
