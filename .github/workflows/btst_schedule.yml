name: Daily BTST Trading Engine

# The schedule trigger is DELIBERATELY REMOVED. The bot now runs on a real
# VM (see deploy/oracle_vm_setup.sh + README's "Running on your own server")
# with actual per-second cron and a tick-level watcher for exits. Running
# this workflow's schedule at the same time caused duplicate/conflicting
# notifications and false "entry window missed" alerts in production: this
# workflow has its own separate `state.json` (committed to the repo) that
# never sees the VM's state, and DATA_PROVIDER here defaults to `yahoo`
# (see the vars.DATA_PROVIDER fallback below) rather than the VM's angelone
# config — so a scheduled run here would independently re-decide entry/exit
# from stale state and a different data feed, racing the VM's own decision.
#
# workflow_dispatch is kept for occasional manual checks (e.g. selftest)
# ONLY — never re-add a `schedule:` trigger here while the VM is the live
# deployment, or this conflict comes back immediately.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which scan to run'
        type: choice
        default: auto
        options: [auto, entry, exit, all, selftest]
      force:
        description: 'Ignore clock gating and deduplication'
        type: boolean
        default: false

permissions:
  contents: write        # required to commit state.json back to the repo

concurrency:
  group: btst-engine
  cancel-in-progress: false

jobs:
  run-btst:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A single invocation: the engine picks entry vs exit from the IST clock.
      # This replaces the old `github.event.schedule == '...'` step conditions,
      # which silently ran BOTH scans on workflow_dispatch (the expression is
      # null for manual runs, so `!= '50 9 * * 1-5'` was always true).
      - name: Run BTST engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Switch data feeds from Settings -> Secrets and variables -> Actions
          # -> Variables (DATA_PROVIDER=yahoo|angelone) — no code push needed.
          # See providers.py for what each provider requires.
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'yahoo' }}
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_CLIENT_ID: ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python btst_engine.py "$MODE" $FORCE

      - name: Persist state
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "btst-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update BTST engine state [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "State pushed."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "::warning::Could not persist state.json after 4 attempts."
