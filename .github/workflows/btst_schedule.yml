name: Daily BTST Trading Engine

# GitHub's scheduled-workflow queue is best-effort: runs are routinely delayed
# by 30-120 minutes and are sometimes dropped entirely. Observed on this repo:
# 4 of 8 expected runs fired on 2026-07-29, and the 15:20 IST entry scan
# actually executed at 17:20 IST.
#
# Two mitigations, both required:
#   1. Schedule redundantly here, so a dropped run is covered by the next one.
#   2. Let btst_engine.py decide what to do from the real IST clock and its
#      state file, so extra wake-ups are harmless and a late one can never
#      emit a tradeable signal after the window has closed.

on:
  schedule:
    # All cron times are UTC. IST = UTC + 5:30.
    # 30m exit monitor — 09:30 to 15:15 IST, every 15 min (2x redundancy per
    # 30m candle; the engine posts one status per completed candle).
    - cron: '*/15 4-9 * * 1-5'
    # Entry scan attempts — 15:18, 15:21, 15:24, 15:27 IST.
    - cron: '48,51,54,57 9 * * 1-5'
    # Late catch-all — 15:35 IST. Reports a *missed* window if none of the
    # above survived; never emits a buy signal this late.
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which scan to run'
        type: choice
        default: auto
        options: [auto, entry, exit, all, selftest]
      force:
        description: 'Ignore clock gating and deduplication'
        type: boolean
        default: false

permissions:
  contents: write        # required to commit state.json back to the repo

concurrency:
  group: btst-engine
  cancel-in-progress: false

jobs:
  run-btst:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A single invocation: the engine picks entry vs exit from the IST clock.
      # This replaces the old `github.event.schedule == '...'` step conditions,
      # which silently ran BOTH scans on workflow_dispatch (the expression is
      # null for manual runs, so `!= '50 9 * * 1-5'` was always true).
      - name: Run BTST engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Switch data feeds from Settings -> Secrets and variables -> Actions
          # -> Variables (DATA_PROVIDER=yahoo|angelone) — no code push needed.
          # See providers.py for what each provider requires.
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER || 'yahoo' }}
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_CLIENT_ID: ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python btst_engine.py "$MODE" $FORCE

      - name: Persist state
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "btst-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update BTST engine state [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "State pushed."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "::warning::Could not persist state.json after 4 attempts."
