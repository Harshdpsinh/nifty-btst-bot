name: Daily BTST Trading Engine

# No schedule. Live trading runs on the VM (deploy/oracle_vm_setup.sh):
# real cron + tick-level watcher. This workflow is manual selftest / debug only.
#
# DATA_PROVIDER is Angel One only. Yahoo was removed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which scan to run'
        type: choice
        default: selftest
        options: [auto, entry, exit, all, selftest]
      force:
        description: 'Ignore clock gating and deduplication'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btst-engine
  cancel-in-progress: false

jobs:
  run-btst:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTST engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_PROVIDER: angelone
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_CLIENT_ID: ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'selftest' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python btst_engine.py "$MODE" $FORCE

      - name: Persist state
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name  "btst-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update BTST engine state [skip ci]"
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "State pushed."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "::warning::Could not persist state.json after 4 attempts."
